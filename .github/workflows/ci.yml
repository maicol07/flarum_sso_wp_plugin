name: CI
# Shared pipeline of maicol07/actions: checks on PRs and master, then on master the release PR and,
# once it is merged, the GitHub Release and the WordPress.org deploy. A job is overridden by
# replacing its `uses:` with its own (same job name, so `needs` keeps working).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release half done on master.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  security:
    uses: maicol07/actions/.github/workflows/security.yml@v2

  commit_lint:
    uses: maicol07/actions/.github/workflows/commit-lint.yml@v2

  # Quality: not in release.needs until composer.lock is fixed (it needs PHP >= 8.3, but
  # config.platform pins 8.0, so composer install fails)
  rector:
    uses: maicol07/actions/.github/workflows/php.yml@v2
    with:
      php_version: '8.5'
      run: vendor/bin/rector process --dry-run --no-progress-bar

  release:
    needs: [security]
    if: github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: maicol07/actions/.github/workflows/release.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      # The older 2-part tags keep their changelog section.
      tag_pattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
      # The plugin header, its constant and readme's stable tag carry the version.
      bump: >-
        sed -i -E "s/^( \* Version: +).*/\1$VERSION/; s/^(const FLARUM_SSO_VERSION = ')[^']*/\1$VERSION/" sso-flarum.php &&
        sed -i -E "s/^(Stable tag: ).*/\1$VERSION/" README.txt

  deploy:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
